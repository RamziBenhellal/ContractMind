<div class="auth-container">
  <h2>Willkommen bei ContractMind</h2>
  <p>Erstelle deinen Account</p>

  <!-- Wenn es Erfolgs- oder Fehlermeldungen gibt, zeigen wir sie hier -->
  <div *ngIf="errorMessage" class="error-box">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success-box">{{ successMessage }}</div>

  <!-- [formGroup] verbindet das HTML mit unserer registerForm aus TypeScript -->
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="email">E-Mail</label>
      <input id="email" type="email" formControlName="email" placeholder="mail@beispiel.de">
    </div>

    <div class="form-group">
      <label for="password">Passwort</label>
      <input id="password" type="password" formControlName="password" placeholder="Mindestens 6 Zeichen">
    </div>

    <button type="submit" [disabled]="registerForm.invalid">Kostenlos Registrieren</button>
  </form>

  <p class="switch-page">
    Hast du schon einen Account? <a routerLink="/login">Hier einloggen</a>
  </p>
</div>
