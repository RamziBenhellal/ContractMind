name: Build and Publish Docker Images

on:
  push:
    branches: [ "main" ] # Führt den Workflow bei jedem Push auf "main" aus

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/contractmind-backend:latest

      - name: Build and Push AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./contractmind-ai
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/contractmind-ai:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/contractmind-frontend:latest