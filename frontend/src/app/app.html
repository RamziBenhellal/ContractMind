@if (authService.isLoggedIn()) {
  <nav class="global-navbar glass-panel">
    <div class="nav-brand">ContractMind</div>
    <ul class="nav-links">
      <li><a routerLink="/dashboard" routerLinkActive="active-link">📊 Dashboard</a></li>
      <li><a routerLink="/chat" routerLinkActive="active-link">✨ Assistant</a></li>
      <li><a routerLink="/add-contract" routerLinkActive="active-link">➕ Neuer Vertrag</a></li>
    </ul>
    <button class="logout-btn" (click)="logout()">Logout</button>
  </nav>

  <!-- Das Chat-Widget soll wahrscheinlich auch nur sichtbar sein, wenn eingeloggt -->
  <app-chat></app-chat>
}
<main class="main-content">
  <router-outlet></router-outlet>
</main>
@if (authService.isLoggedIn()) {
<app-chat></app-chat>
}
