version: '3.9'

# ================================================
#  ContractMind – Docker Compose
#  Startet: PostgreSQL + Qdrant + Spring Boot + Python AI
# ================================================

services:

  # ── PostgreSQL Datenbank ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: contractmind-postgres
    environment:
      POSTGRES_DB: contractmind
      POSTGRES_USER: contractmind_user
      POSTGRES_PASSWORD: contractmind_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractmind_user -d contractmind"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contractmind-net

  # ── Qdrant Vektordatenbank ────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: contractmind-qdrant
    ports:
      - "6333:6333"     # REST API
      - "6334:6334"     # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - contractmind-net

  # ── Python KI-Microservice ────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: contractmind-ai
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - contractmind-net

  # ── Spring Boot Backend ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contractmind-backend
    ports:
      - "8080:8080"
    environment:
      - DB_USERNAME=contractmind_user
      - DB_PASSWORD=contractmind_pass
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/contractmind
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-meinSuperGeheimerSchluesselFuerContractMind2024!}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - contractmind-net

# ── Volumes ────────────────────────────────────────
volumes:
  postgres_data:
  qdrant_data:
  uploads:

# ── Netzwerk ───────────────────────────────────────
networks:
  contractmind-net:
    driver: bridge