<div class="upload-container" style="max-width: 600px; margin: 50px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
  <h2 style="text-align: center; color: #1a2a6c;">Neuen Vertrag hinzufügen</h2>

  <!-- 🎛️ DIE SCHALTER (TOGGLE) -->
  <div style="display: flex; gap: 10px; margin-bottom: 30px; margin-top: 20px;">
    <button (click)="entryMode = 'upload'"
            [style.background]="entryMode === 'upload' ? '#1a2a6c' : '#eee'"
            [style.color]="entryMode === 'upload' ? 'white' : '#333'"
            style="flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
      📄 PDF hochladen
    </button>
    <button (click)="entryMode = 'manual'"
            [style.background]="entryMode === 'manual' ? '#1a2a6c' : '#eee'"
            [style.color]="entryMode === 'manual' ? 'white' : '#333'"
            style="flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
      ✍️ Manuell eintragen
    </button>
  </div>

  <!-- 📂 BEREICH 1: PDF UPLOAD -->
  @if (entryMode === 'upload') {
    <div class="auth-container" style="max-width: 500px; margin-top: 50px; text-align: center;">
      <h2>📄 Vertrag hochladen</h2>
      <p>Lade dein PDF hoch. Unsere KI erledigt den Rest!</p>

      <div *ngIf="errorMessage" class="error-box">{{ errorMessage }}</div>

      <!-- Eine schöne Upload-Box -->
      <div style="border: 2px dashed #ccc; padding: 40px; margin: 20px 0; border-radius: 10px; background: #fafafa;">
        <input type="file" id="file" accept=".pdf" (change)="onFileSelected($event)" style="display: none;" #fileInput>

        <button type="button" (click)="fileInput.click()" style="background: white; color: #1a2a6c; border: 2px solid #1a2a6c; margin-bottom: 15px;">
          📁 PDF auswählen
        </button>

        <div *ngIf="selectedFile" style="color: green; font-weight: bold;">
          ✓ {{ selectedFile.name }}
        </div>
      </div>

      <button (click)="onSubmit()" [disabled]="!selectedFile || isUploading" style="background: #f2a900; color: #1a2a6c; font-weight: bold;">
        {{ isUploading ? 'Lade hoch...' : 'Hochladen & KI Analyse starten' }}
      </button>

      <button type="button" routerLink="/dashboard" style="background: transparent; color: #888; margin-top: 10px;">
        Abbrechen
      </button>
    </div>
  }

  <!-- ✍️ BEREICH 2: MANUELLES FORMULAR -->
  @if (entryMode === 'manual') {
    <form (ngSubmit)="saveManualContract()">
      <div class="form-group" style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Anbieter</label>
        <input type="text" [(ngModel)]="newManualContract.provider" name="provider" required
               style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
      </div>

      <div class="form-group" style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Kategorie (z.B. Internet, Strom)</label>
        <input type="text" [(ngModel)]="newManualContract.contractType" name="contractType" required
               style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
      </div>

      <div class="form-group" style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Monatliche Kosten (€)</label>
        <input type="number" step="0.01" [(ngModel)]="newManualContract.monthlyCost" name="monthlyCost" required
               style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
      </div>

      <div class="form-group" style="margin-bottom: 25px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Vertragsende</label>
        <input type="date" [(ngModel)]="newManualContract.endDate" name="endDate"
               style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
        <small style="color: #666; font-size: 11px;">*Für unbefristete Verträge wähle das Jahr 2099.</small>
      </div>

      <button type="submit" [disabled]="isSaving"
              style="width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer;">
        {{ isSaving ? 'Speichert...' : '✅ Vertrag speichern' }}
      </button>
    </form>
  }
</div>
