server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/contractmind
    username: contractmind_user
    password: contractmind_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

contractmind:
  upload-dir: uploads/contracts

# Custom Settings für den KI-Service
ai-service:
  url: http://localhost:8000
  timeout-ms: 3000
  retry:
    max-attempts: 2
    backoff-ms: 200

# GoCardless API Credentials
gocardless:
  api:
    url: https://bankaccountdata.gocardless.com/api/v2
  secret:
    id: ContractMind
    key: live_iNfqglAuUXTKAkW7vG7-vMqsMolEJhlvrnZ5yNt9

# Python FinTS-Service + AES-Schlüssel für gespeicherte Zugangsdaten.
# FINTS_ENCRYPTION_KEY kommt aus der Umgebung oder später aus Vault.
fints:
  service:
    url: ${FINTS_SERVICE_URL:http://localhost:8000}
  encryption-key: ${FINTS_ENCRYPTION_KEY:dev-only-not-for-production}
  internal-token: ${FINTS_INTERNAL_TOKEN:dev-internal}
  sync:
    enabled: true
    cron: "0 0 */6 * * *"
