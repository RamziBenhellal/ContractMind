spring:
  datasource:
    url: jdbc:h2:mem:contractmind;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

gocardless:
  api:
    url: http://localhost:9
  secret:
    id: test
    key: test

ai-service:
  url: http://localhost:9

fints:
  service:
    url: http://localhost:9
  encryption-key: test-only-fints-key
  sync:
    enabled: false
