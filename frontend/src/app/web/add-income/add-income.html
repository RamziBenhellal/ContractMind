<div class="upload-wrapper">
  <!-- Der Hauptcontainer im Glas-Look -->
  <div class="glass-panel upload-container">
    <h2 class="premium-title">Neuen Income hinzufügen</h2>

    <!-- ✍️ BEREICH 2: MANUELLES FORMULAR -->
      <form (ngSubmit)="saveIncome()" class="section-content animate-fade manual-form-container">

        <div class="form-group premium-input-group">
          <label>🏢 Source</label>
          <div class="input-wrapper">
            <input type="text" [(ngModel)]="newIncome.source" name="source" placeholder="z.B. Gehalt" required class="ultra-modern-input">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group premium-input-group half-width">
            <label>💶 Monatliche Beitrag</label>
            <div class="input-wrapper cost-wrapper">
              <input type="number" step="0.01" [(ngModel)]="newIncome.amount" name="amount" placeholder="0.00" required class="ultra-modern-input has-suffix">
              <span class="input-suffix">€</span>
            </div>
          </div>
          </div>
        <div class="button-group-full form-footer">
          <button type="submit" class="premium-save-btn full-width glowing-btn" [disabled]="isSaving">
            @if (isSaving) {
              <span class="spin-icon">⏳</span> Vertrag wird gespeichert...
            } @else {
              ✨ Einkommen speichern
            }
          </button>
        </div>
      </form>
  </div>
</div>
