<div class="upload-wrapper">
  <!-- Der Hauptcontainer im Glas-Look -->
  <div class="glass-panel upload-container">
    <h2 class="premium-title">Neuen Vertrag hinzufügen</h2>

    <!-- 🎛️ DIE SCHALTER (TOGGLE) ALS GLAS-PILLEN -->
    <div class="toggle-group">
      <button class="toggle-btn"
              [class.active]="entryMode === 'upload'"
              (click)="entryMode = 'upload'">
        📄 PDF hochladen
      </button>
      <button class="toggle-btn"
              [class.active]="entryMode === 'manual'"
              (click)="entryMode = 'manual'">
        ✍️ Manuell eintragen
      </button>
    </div>

    <!-- 📂 BEREICH 1: PDF UPLOAD -->
    @if (entryMode === 'upload') {
      <div class="section-content animate-fade">
        <p class="subtitle">Lade dein PDF hoch. Unsere KI erledigt den Rest!</p>

        @if (errorMessage) {
          <div class="error-glass-box">{{ errorMessage }}</div>
        }

        <!-- Die Premium Upload-Dropzone -->
        <div class="glass-dropzone">
          <input type="file" id="file" accept=".pdf" (change)="onFileSelected($event)" class="hidden-input" #fileInput>

          <button type="button" class="glass-btn select-file-btn" (click)="fileInput.click()">
            📁 PDF auf deinem Gerät suchen
          </button>

          @if (selectedFile) {
            <div class="file-success-text">
              <span class="success-icon">✓</span> {{ selectedFile.name }}
            </div>
          }
        </div>

        <!-- Buttons -->
        <div class="button-group">
          <button type="button" class="glass-btn cancel-btn" routerLink="/dashboard">
            Abbrechen
          </button>

          <button class="premium-ai-btn" (click)="onSubmit()" [disabled]="!selectedFile || isUploading">
            @if (isUploading) {
              <span class="spin-icon">⏳</span> Lade hoch...
            } @else {
              ✨ Hochladen & KI Analyse
            }
          </button>
        </div>
      </div>
    }

    <!-- ✍️ BEREICH 2: MANUELLES FORMULAR -->
    @if (entryMode === 'manual') {
      <form (ngSubmit)="saveManualContract()" class="section-content animate-fade manual-form-container">

        <div class="form-group premium-input-group">
          <label>🏢 Anbieter</label>
          <div class="input-wrapper">
            <input type="text" [(ngModel)]="newManualContract.provider" name="provider" placeholder="z.B. Telekom, Allianz..." required class="ultra-modern-input">
          </div>
        </div>

        <div class="form-group premium-input-group">
          <label>🏷️ Kategorie <span class="label-hint">(z.B. Internet, Strom)</span></label>
          <div class="input-wrapper">
            <input type="text" [(ngModel)]="newManualContract.contractType" name="contractType" placeholder="z.B. Internet" required class="ultra-modern-input">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group premium-input-group half-width">
            <label>💶 Monatliche Kosten</label>
            <div class="input-wrapper cost-wrapper">
              <input type="number" step="0.01" [(ngModel)]="newManualContract.monthlyCost" name="monthlyCost" placeholder="0.00" required class="ultra-modern-input has-suffix">
              <span class="input-suffix">€</span>
            </div>
          </div>

          <div class="form-group premium-input-group half-width">
            <label>⏳ Vertragsende</label>
            <div class="input-wrapper">
              <input type="date" [(ngModel)]="newManualContract.endDate" name="endDate" class="ultra-modern-input">
            </div>
            <small class="helper-text">*Für unbefristete Verträge wähle das Jahr 2099.</small>
          </div>
        </div>

        <div class="button-group-full form-footer">
          <button type="submit" class="premium-save-btn full-width glowing-btn" [disabled]="isSaving">
            @if (isSaving) {
              <span class="spin-icon">⏳</span> Vertrag wird gespeichert...
            } @else {
              ✨ Vertrag manuell speichern
            }
          </button>
        </div>

      </form>
    }
  </div>
</div>
