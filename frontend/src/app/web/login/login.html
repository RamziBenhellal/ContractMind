<div class="auth-wrapper">
  <div class="glass-card auth-container">
    <h2 class="auth-title">ContractMind Login</h2>

    <div *ngIf="errorMessage" class="error-box">{{ errorMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="beispiel@domain.de">
      </div>

      <div class="form-group">
        <label for="password">Passwort</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-login">Einloggen</button>
    </form>

    <p class="switch-page">
      Noch keinen Account? <a routerLink="/register">Jetzt registrieren</a>
    </p>
  </div>
</div>
