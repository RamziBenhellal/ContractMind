<div class="auth-wrapper">
  <div class="glass-panel auth-container">
    <h2 class="auth-title">Willkommen bei ContractMind</h2>
    <p class="auth-subtitle">Erstelle deinen Account und starte durch</p>

    @if (errorMessage) { <div class="error-glass-box">{{ errorMessage }}</div> }
    @if (successMessage) { <div class="success-glass-box">{{ successMessage }}</div> }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">

      <div class="premium-input-group">
        <label for="email">E-Mail</label>
        <input id="email" type="email" formControlName="email" placeholder="deine@email.de" class="ultra-modern-input">
      </div>

      <div class="premium-input-group">
        <label for="password">Passwort</label>
        <input id="password" type="password" formControlName="password" placeholder="Mindestens 6 Zeichen" class="ultra-modern-input">
      </div>

      <button type="submit" [disabled]="registerForm.invalid" class="premium-save-btn full-width">
        Kostenlos Registrieren
      </button>
    </form>

    <p class="switch-page">
      Hast du schon einen Account? <a routerLink="/login">Hier einloggen</a>
    </p>
  </div>
</div>
